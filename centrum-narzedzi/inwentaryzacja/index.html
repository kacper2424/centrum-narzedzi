<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inwentaryzacja QR - Panel Główny</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="/../css/index_inwentaryzacja.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-customfonts/1.0.4/Roboto-Regular-normal.js"></script>

</head>

<body>

    <a href="/" class="home-button" title="Strona główna">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z" />
        </svg>
    </a>

    <div class="main-container">
        <div class="controls-panel">
            <h1>Inwentaryzacja</h1>
            <div id="scanner-session-box" class="session-code-box">
                <p>Kod do połączenia ze skanerem:</p>
                <h2 id="scanner-session-code">...</h2>
            </div>
            <div id="signer-session-box" class="session-code-box" style="display: none; background-color: #6f42c1;">
                <p>Otwórz na tablecie /signer.html i podaj kod:</p>
                <h2 id="signer-session-code">...</h2>
                <div id="signer-spinner" class="spinner" style="display: none;"></div>
                <p id="signer-status" style="margin-top: 10px;"></p>
            </div>

            <div class="control-group">
                <label for="file-upload">1. Wgraj plik Excel</label>
                <input type="file" id="file-upload" accept=".xlsx, .xls">
            </div>
            <hr>
            <div class="control-group">
                <h3>Dodaj ręcznie</h3>
                <input type="text" id="manual-input" placeholder="Wpisz kod i naciśnij Enter">
            </div>
            <hr>
            <div class="control-group">
                <h3>Opcje</h3>
                <button id="download-report-btn" class="btn-success">📥 Pobierz raport Excel</button>
                <button id="generate-pdf-btn" class="btn-primary">📄 Generuj Raport PDF</button>
                <button id="clear-scans-btn" class="btn-danger">🗑️ Wyczyść skany</button>
            </div>
        </div>

        <div class="results-panel">
            <h2>Porównanie stanów</h2>
            <div id="scan-status" class="status-info">Oczekiwanie na wgranie pliku...</div>
            <div class="results-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Stan z pliku</th>
                            <th style="text-align: center;">Zeskanowano</th>
                            <th>Roznica</th>
                        </tr>
                    </thead>
                    <tbody id="results-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let excelData = [], scannedData = {};
        const sessionCode = Date.now().toString().substr(-4);
        let signatureCheckInterval = null;
        const serverUrl = new URL('server.php', window.location.href).href;

        const fileUpload = document.getElementById('file-upload'),
              manualInput = document.getElementById('manual-input'),
              clearScansButton = document.getElementById('clear-scans-btn'),
              downloadReportButton = document.getElementById('download-report-btn'),
              resultsTableBody = document.getElementById('results-table-body'),
              scanStatusDiv = document.getElementById('scan-status'), 
              scannerSessionCodeH2 = document.getElementById('scanner-session-code'),
              scannerSessionBox = document.getElementById('scanner-session-box'),
              generatePdfBtn = document.getElementById('generate-pdf-btn'),
              signerSessionBox = document.getElementById('signer-session-box'),
              signerSessionCodeH2 = document.getElementById('signer-session-code'),
              signerSpinner = document.getElementById('signer-spinner'),
              signerStatus = document.getElementById('signer-status');
        
        scannerSessionCodeH2.textContent = sessionCode;
        
        async function createSession() {
            const formData = new FormData();
            formData.append('action', 'create_session');
            formData.append('session', sessionCode);
            await fetch(serverUrl, { method: 'POST', body: formData });
        }
        createSession();

        async function fetchScans() {
            try {
                const response = await fetch(`${serverUrl}?action=get_scans&session=${sessionCode}`);
                if (response.ok) {
                    const newScans = await response.json();
                    if (newScans.length > 0) {
                        scannerSessionBox.classList.add('connected');
                        newScans.forEach(model => {
                            scannedData[model] = (scannedData[model] || 0) + 1;
                            scanStatusDiv.textContent = `📲 Zeskanowano z telefonu: ${model} (Ilość: ${scannedData[model]})`;
                            scanStatusDiv.className = 'status-success';
                        });
                        renderTable();
                    }
                }
            } catch (error) { console.error("Błąd pobierania skanów:", error); }
        }
        setInterval(fetchScans, 1500);

        function renderTable() {
            resultsTableBody.innerHTML = '';
            const allModels = new Set([...excelData.map(item => item.model), ...Object.keys(scannedData)]);
            if (allModels.size === 0) {
                scanStatusDiv.textContent = excelData.length > 0 ? "Gotowy do skanowania." : "Oczekiwanie na wgranie pliku...";
                scanStatusDiv.className = 'status-info'; return;
            }
            const dataToRender = [];
            allModels.forEach(model => {
                if (!model || model.toLowerCase() === 'nan') return;
                const excelItem = excelData.find(item => item.model === model) || { stan: 0 };
                const scannedCount = scannedData[model] || 0;
                const difference = scannedCount - excelItem.stan;
                dataToRender.push({ model, stan: excelItem.stan, zeskanowano: scannedCount, roznica: difference });
            });
            dataToRender.sort((a, b) => (a.roznica !== b.roznica) ? a.roznica - b.roznica : a.model.localeCompare(b.model));
            
            dataToRender.forEach(item => {
                const row = document.createElement('tr');
                let diffClass = item.roznica < 0 ? 'diff-negative' : (item.roznica > 0 ? 'diff-positive' : '');
                row.innerHTML = `
                    <td>${item.model}</td>
                    <td>${item.stan}</td>
                    <td>
                        <div class="quantity-controls">
                            <button class="btn-danger quantity-change" data-model="${item.model}" data-change="-1">-</button>
                            <span class="quantity-value">${item.zeskanowano}</span>
                            <button class="btn-success quantity-change" data-model="${item.model}" data-change="1">+</button>
                        </div>
                    </td>
                    <td class="${diffClass}">${item.roznica > 0 ? '+' : ''}${item.roznica}</td>`;
                resultsTableBody.appendChild(row);
            });
        }
        
        resultsTableBody.addEventListener('click', (event) => {
            const button = event.target.closest('.quantity-change');
            if (!button) return;

            const model = button.dataset.model;
            const change = parseInt(button.dataset.change, 10);

            scannedData[model] = (scannedData[model] || 0) + change;
            if (scannedData[model] <= 0) {
                delete scannedData[model];
            }

            scanStatusDiv.textContent = `📝 Ręcznie zmieniono ilość dla: ${model}`;
            scanStatusDiv.className = 'status-info';
            renderTable();
        });
        
        fileUpload.addEventListener('change', (event) => {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result), workbook = XLSX.read(data, { type: 'array' }),
                          sheetName = workbook.SheetNames[0], worksheet = workbook.Sheets[sheetName],
                          allRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    if (allRows.length === 0) throw new Error("Plik Excel jest pusty.");
                    let headerRowIndex = -1, headers = [];
                    for (let i = 0; i < allRows.length; i++) {
                        const row = allRows[i].map(h => String(h).toLowerCase().trim());
                        if (row.includes('model') && row.includes('stan')) {
                            headerRowIndex = i; headers = row; break;
                        }
                    }
                    if (headerRowIndex === -1) throw new Error("Nie znaleziono wiersza z nagłówkami 'model' i 'stan'.");
                    const modelIndex = headers.indexOf('model'), stanIndex = headers.indexOf('stan'),
                          dataRows = allRows.slice(headerRowIndex + 1);
                    excelData = dataRows.map(row => ({ model: String(row[modelIndex] || '').trim(), stan: parseInt(row[stanIndex], 10) || 0 }))
                                      .filter(item => item.model && item.model.length > 0);
                    scanStatusDiv.textContent = `✅ Plik wczytany. Znaleziono ${excelData.length} modeli.`;
                    scanStatusDiv.className = 'status-success';
                    renderTable();
                } catch (err) {
                    scanStatusDiv.textContent = `❌ Błąd: ${err.message}`;
                    scanStatusDiv.className = 'status-error';
                    excelData = []; renderTable();
                }
            };
            reader.readAsArrayBuffer(file);
        });

        manualInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const model = manualInput.value.trim();
                if (model) {
                    scannedData[model] = (scannedData[model] || 0) + 1;
                    scanStatusDiv.textContent = `👍 Dodano ręcznie: ${model} (Ilość: ${scannedData[model]})`;
                    scanStatusDiv.className = 'status-success';
                    manualInput.value = ''; renderTable();
                }
            }
        });

        clearScansButton.addEventListener('click', () => {
            if (confirm('Czy na pewno chcesz usunąć wszystkie zeskanowane pozycje?')) {
                scannedData = {};
                scanStatusDiv.textContent = 'Wszystkie skany zostały wyczyszczone.';
                scanStatusDiv.className = 'status-info';
                renderTable();
            }
        });

        downloadReportButton.addEventListener('click', () => {
            const dataToExport = [];
            const allModels = new Set([...excelData.map(item => item.model), ...Object.keys(scannedData)]);
            allModels.forEach(model => {
                 if (!model || model.toLowerCase() === 'nan') return;
                const excelItem = excelData.find(item => item.model === model) || { stan: 0 };
                const scannedCount = scannedData[model] || 0;
                const difference = scannedCount - excelItem.stan;
                dataToExport.push({'Model': model, 'Stan z pliku': excelItem.stan, 'Zeskanowano': scannedCount, 'Roznica': difference > 0 ? `+${difference}` : difference});
            });
            if(dataToExport.length === 0) { alert("Brak danych do wygenerowania raportu."); return; }
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Raport Inwentaryzacji");
            XLSX.writeFile(workbook, "Raport_Inwentaryzacji.xlsx");
        });
        
        generatePdfBtn.addEventListener('click', () => {
            if (Object.keys(scannedData).length === 0 && excelData.length === 0) {
                alert("Brak danych do wygenerowania raportu.");
                return;
            }

            let hasDiscrepancy = false;
            const allModels = new Set([...excelData.map(item => item.model), ...Object.keys(scannedData)]);

            allModels.forEach(model => {
                if (!model || model.toLowerCase() === 'nan') return;
                const excelItem = excelData.find(item => item.model === model) || { stan: 0 };
                const scannedCount = scannedData[model] || 0;
                const difference = scannedCount - excelItem.stan;
                if (difference !== 0) {
                    hasDiscrepancy = true;
                }
            });

            if (hasDiscrepancy) {
                const userConfirmed = confirm('Wykryto niezgodności w stanie magazynowym (braki lub nadwyżki).\n\nCzy na pewno chcesz kontynuować generowanie raportu PDF?');
                if (!userConfirmed) {
                    return; 
                }
            }

            signerSessionCodeH2.textContent = sessionCode;
            signerSessionBox.style.display = 'block';
            signerSpinner.style.display = 'block';
            signerStatus.textContent = 'Oczekuję na podpisy z tabletu...';

            if (signatureCheckInterval) clearInterval(signatureCheckInterval);
            signatureCheckInterval = setInterval(checkForSignatures, 2000);
        });
        
        async function checkForSignatures() {
            try {
                const response = await fetch(`${serverUrl}?action=get_signatures&session=${sessionCode}`);
                const result = await response.json();
                if (result.status === 'ok') {
                    clearInterval(signatureCheckInterval);
                    signerSpinner.style.display = 'none';
                    signerStatus.textContent = '✅ Podpisy otrzymane! Generowanie PDF...';
                    generatePDF(result.signature1, result.signature2);
                    setTimeout(() => { signerSessionBox.style.display = 'none'; }, 3000);
                }
            } catch (error) { console.error('Błąd sprawdzania podpisów:', error); }
        }

function generatePDF(sig1Data, sig2Data) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont('helvetica', 'normal');

    const today = new Date();
    const dateString = `${today.getFullYear()}-${(today.getMonth() + 1).toString().padStart(2, '0')}-${today.getDate().toString().padStart(2, '0')}`;
    const fileName = `Raport_inwentaryzacji_${dateString}.pdf`;

    doc.setFontSize(18);
    doc.text("Raport z Inwentaryzacji", 14, 22);
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Data: ${today.toLocaleString('pl-PL').replace(/[\u0100-\u017F]/g, '')}`, 14, 28);

    const head = [['Model', 'Stan', 'Skan', 'Roznica']];
    
    const allModels = new Set([...excelData.map(item => item.model), ...Object.keys(scannedData)]);
    const dataToRender = [];
    allModels.forEach(model => {
        if (!model || model.toLowerCase() === 'nan') return;
        const excelItem = excelData.find(item => item.model === model) || { stan: 0 };
        const scannedCount = scannedData[model] || 0;
        const diff = scannedCount - excelItem.stan;
        dataToRender.push({ model, stan: excelItem.stan, zeskanowano: scannedCount, roznica: diff });
    });

    dataToRender.sort((a, b) => (a.roznica !== b.roznica) ? a.roznica - b.roznica : a.model.localeCompare(b.model));

    const totalItems = dataToRender.length;
    const itemsPerCol = Math.ceil(totalItems / 3);
    
    const col1Data = dataToRender.slice(0, itemsPerCol);
    const col2Data = dataToRender.slice(itemsPerCol, itemsPerCol * 2);
    const col3Data = dataToRender.slice(itemsPerCol * 2);

    const columns = [col1Data, col2Data, col3Data];
    const tableWidth = 62; 
    const spacing = 4;     
    const startY = 35;
    let maxFinalY = startY;

    columns.forEach((colData, index) => {
        if (colData.length === 0) return;

        const body = colData.map(item => [
            item.model,
            item.stan,
            item.zeskanowano,
            item.roznica > 0 ? `+${item.roznica}` : item.roznica
        ]);

        doc.autoTable({
            startY: startY,
            head: head,
            body: body,
            theme: 'grid',
            margin: { left: 10 + (index * (tableWidth + spacing)) },
            tableWidth: tableWidth,
            styles: {
                fontSize: 7, 
                cellPadding: 1
            },
            headStyles: {
                fillColor: [67, 126, 181],
                textColor: 255,
                fontSize: 7
            },
            columnStyles: {
                0: { cellWidth: 'auto' }, 
                1: { cellWidth: 8, halign: 'center' },
                2: { cellWidth: 8, halign: 'center' },
                3: { cellWidth: 8, halign: 'center' }
            }
        });

        if (doc.autoTable.previous.finalY > maxFinalY) {
            maxFinalY = doc.autoTable.previous.finalY;
        }
    });

    const totalFromFile = excelData.reduce((sum, item) => sum + (item.stan || 0), 0);
    const totalScanned = Object.values(scannedData).reduce((sum, count) => sum + count, 0);
    const totalDiff = totalScanned - totalFromFile;

    doc.setFontSize(9);
    doc.setTextColor(0);
    doc.text(`Lacznie w pliku: ${totalFromFile} | Zeskanowano: ${totalScanned} | Roznica: ${totalDiff > 0 ? '+' : ''}${totalDiff}`, 14, maxFinalY + 10);

    let finalY = maxFinalY + 20;
    const pageHeight = doc.internal.pageSize.getHeight();
    if (finalY + 40 > pageHeight) {
        doc.addPage();
        finalY = 20;
    }

    doc.setFontSize(10);
    doc.text("Sporzadzil:", 14, finalY);
    if (sig1Data) doc.addImage(sig1Data, 'PNG', 14, finalY + 2, 50, 20);
    doc.text("........................................", 14, finalY + 25);

    doc.text("Odebral:", 110, finalY);
    if (sig2Data) doc.addImage(sig2Data, 'PNG', 110, finalY + 2, 50, 20);
    doc.text("........................................", 110, finalY + 25);

    doc.save(fileName);
}
    </script>

    <footer class="footer-screen">

</body>
